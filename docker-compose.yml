services:
    api:
        build:
          context: .
          dockerfile: Dockerfile
          args:
            WEB_PLUGINS: ${WEB_PLUGINS:-}
        restart: 'always'
        depends_on:
            - postgis
            - media
            - store
        ports:
            - "5000:5000"
        environment:
            - CLOUDTAK_Mode=${CLOUDTAK_Mode}
            - CLOUDTAK_Server_Mode=${CLOUDTAK_Server_Mode:-both}
            - CLOUDTAK_Hub_URL=${CLOUDTAK_Hub_URL}
            - HUB_RPC_PORT=${HUB_RPC_PORT:-5002}
            - CLOUDTAK_Config_media_url=${CLOUDTAK_Config_media_url}
            - SigningSecret=${SigningSecret}
            - ASSET_BUCKET=${ASSET_BUCKET}
            - AWS_S3_Endpoint=${AWS_S3_Endpoint}
            - AWS_S3_AccessKeyId=${AWS_S3_AccessKeyId}
            - AWS_S3_SecretAccessKey=${AWS_S3_SecretAccessKey}
            - POSTGRES=${POSTGRES}
            - API_URL=${API_URL}
            - PMTILES_URL=${PMTILES_URL}

    tiles:
        build:
          context: .
          dockerfile: ./tasks/pmtiles/Dockerfile.compose
        restart: 'always'
        ports:
            - "5002:5002"
        environment:
            - API_URL=${API_URL}
            - PMTILES_URL=${PMTILES_URL}
            - SigningSecret=${SigningSecret}
            - ASSET_BUCKET=${ASSET_BUCKET}
            - AWS_S3_Endpoint=${AWS_S3_Endpoint}
            - AWS_S3_AccessKeyId=${AWS_S3_AccessKeyId}
            - AWS_S3_SecretAccessKey=${AWS_S3_SecretAccessKey}

    events:
        build:
          context: .
          dockerfile: ./tasks/events/Dockerfile
        restart: 'always'
        depends_on:
            - api
            - store
        environment:
            - CLOUDTAK_Mode=${CLOUDTAK_Mode}
            - API_URL=${API_URL}
            - SigningSecret=${SigningSecret}
            - ASSET_BUCKET=${ASSET_BUCKET}
            - AWS_S3_Endpoint=${AWS_S3_Endpoint}
            - AWS_S3_AccessKeyId=${AWS_S3_AccessKeyId}
            - AWS_S3_SecretAccessKey=${AWS_S3_SecretAccessKey}

    retention:
        build:
          context: .
          dockerfile: ./tasks/retention/Dockerfile.compose
        restart: 'always'
        depends_on:
            - api
            - postgis
            - store
        environment:
            CLOUDTAK_Mode: ${CLOUDTAK_Mode}
            API_URL: ${API_URL}
            ASSET_BUCKET: ${ASSET_BUCKET}
            AWS_REGION: ${AWS_REGION:-us-east-1}
            AWS_S3_Endpoint: ${AWS_S3_Endpoint}
            AWS_S3_AccessKeyId: ${AWS_S3_AccessKeyId}
            AWS_S3_SecretAccessKey: ${AWS_S3_SecretAccessKey}
            SigningSecret: ${SigningSecret}
            RETENTION_SCHEDULE: ${RETENTION_SCHEDULE:-0 3 * * *}

    media:
        image: ghcr.io/dfpc-coe/media-infra:v9.10.0
        restart: 'always'
        environment:
            - API_URL=${API_URL}
            - SigningSecret=${SigningSecret}
            - MEDIAMTX_LOGLEVEL=${MEDIAMTX_LOGLEVEL:-info}
            - CLOUDTAK_Config_media_url=${CLOUDTAK_Config_media_url}
        ports:
            - "${MEDIA_PORT_API:-9997}:9997"
            - "${MEDIA_PORT_RTSP:-8554}:8554"
            - "${MEDIA_PORT_RTMP:-1935}:1935"
            - "${MEDIA_PORT_HLS:-8888}:8888"
            - "${MEDIA_PORT_SRT:-8890}:8890"

    postgis:
        image: postgis/postgis:17-3.4-alpine
        restart: 'always'
        ports:
            - 127.0.0.1:5433:5432
        environment:
            - POSTGRES_DB=gis
            - POSTGRES_USER=docker
            - POSTGRES_PASSWORD=docker

    store:
        image: dxflrs/garage:v2.4.1
        command: /garage server --single-node --default-bucket
        restart: 'always'
        volumes:
            - ./garage.toml:/etc/garage.toml:ro
            - .docker-garage/meta:/var/lib/garage/meta
            - .docker-garage/data:/var/lib/garage/data
        ports:
            - 127.0.0.1:3900:3900
        environment:
            - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
            - GARAGE_DEFAULT_BUCKET=${ASSET_BUCKET}
            - GARAGE_DEFAULT_ACCESS_KEY=${AWS_S3_AccessKeyId}
            - GARAGE_DEFAULT_SECRET_KEY=${AWS_S3_SecretAccessKey}

