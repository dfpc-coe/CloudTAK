# Garage object store for the Docker Compose deployment
# rpc_secret, default bucket & access key are supplied via environment in docker-compose.yml

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"
root_domain = ".s3.store"

[admin]
api_bind_addr = "[::]:3903"
