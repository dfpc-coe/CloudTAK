[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "generate-test-data"
version = "0.1.0"
description = "Generate spatial test datasets and optionally zip them"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "GDAL>=3.10",
  "argcomplete>=3",
]

[project.scripts]
generate-test-data = "generate_test_data.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
