name: AWS ECR

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  id-token: write
  contents: read

jobs:
  build:
    # Skipped (not failed) for PRs from external forks, which have no access to the AWS secrets
    if: >-
      github.event.pull_request.draft == false &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        task: [api, pmtiles, events, retention]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{github.event.pull_request.head.sha || github.sha}}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws-us-gov:iam::${{secrets.AWS_ACCOUNT_ID}}:role/Github-ECR-Builder
          role-session-name: GithubECRBuilder
          aws-region: ${{secrets.AWS_REGION}}

      - name: Docker Build Task (Production)
        run: npm run build -- ${{matrix.task}}
        env:
          Environment: 'cotak-prod,wftak-prod'
          AWS_ACCOUNT_ID: ${{secrets.AWS_ACCOUNT_ID}}
          AWS_REGION: ${{secrets.AWS_REGION}}

      - name: Configure AWS Credentials (STAGING)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{secrets.AWS_STAGING_ACCOUNT_ID}}:role/Github-ECR-Builder
          role-session-name: GithubECRBuilder
          aws-region: ${{secrets.AWS_STAGING_REGION}}

      - name: Docker Build Task (Staging)
        run: npm run build -- ${{matrix.task}}
        env:
          Environment: 'cotak-staging,wftak-staging'
          AWS_ACCOUNT_ID: ${{secrets.AWS_STAGING_ACCOUNT_ID}}
          AWS_REGION: ${{secrets.AWS_STAGING_REGION}}
