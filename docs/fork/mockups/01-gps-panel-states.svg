<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='890' viewBox='0 0 1200 890'><title>GPS panel states</title><rect width='1200' height='890' fill='#1b2330'/><text x='20' y='36' font-size='20' fill='#e6edf3' font-weight='bold' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>GPS panel (lower left of the map): states per session</text><text x='20' y='58' font-size='12' fill='#8b98a9' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Panel is 220 x 84 px today. The chip floats above it, so the panel height does not change.</text><line x1='20' y1='80' x2='1180' y2='80' stroke='#3a465a'/><text x='20' y='150' font-size='15' fill='#e6edf3' font-weight='bold' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Web  ·  Live</text><g transform='translate(250,120) scale(1.3)'><rect width='220' height='84' rx='8' fill='#263041' stroke='#3a465a'/><text x='12' y='21' font-size='14' fill='#e6edf3' font-weight='bold' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Alex</text><g transform='translate(170,15)' stroke='#22c55e' fill='none' stroke-width='1.5' stroke-linecap='round'><circle r='5'/><circle r='1.6' fill='#22c55e'/><line x1='0' y1='-9' x2='0' y2='-6'/><line x1='0' y1='9' x2='0' y2='6'/><line x1='-9' y1='0' x2='-6' y2='0'/><line x1='9' y1='0' x2='6' y2='0'/></g><g transform='translate(200,15)' stroke='#22c55e' fill='none' stroke-width='1.6' stroke-linecap='round'><path d='M-3.6,-4.8 A6,6 0 0 0 -3.6,4.8'/><path d='M3.6,-4.8 A6,6 0 0 1 3.6,4.8'/><path d='M-6.0,-8.0 A10,10 0 0 0 -6.0,8.0'/><path d='M6.0,-8.0 A10,10 0 0 1 6.0,8.0'/><circle r='2' fill='#22c55e' stroke-dasharray='none'/></g><text x='12' y='42' font-size='11' fill='#e6edf3' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>42 m MSL</text><text x='208' y='42' font-size='11' fill='#8b98a9' font-weight='normal' text-anchor='end' font-family='Helvetica, Arial, sans-serif'>+/- 8 m</text><text x='12' y='58' font-size='11' fill='#e6edf3' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>0 km/h</text><text x='208' y='58' font-size='11' fill='#e6edf3' font-weight='normal' text-anchor='end' font-family='Helvetica, Arial, sans-serif'>--°</text><text x='12' y='75' font-size='10' fill='#8b98a9' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>-41.28650, 174.77620</text></g><text x='600' y='130' font-size='13' fill='#e6edf3' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Icon is a status indicator only (green). There is no Pause on web.</text><text x='600' y='150' font-size='13' fill='#8b98a9' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Shown while this browser holds the broadcaster role.</text><text x='600' y='170' font-size='13' fill='#8b98a9' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>To stop: close the tab, or Take over from another device.</text><line x1='20' y1='240' x2='1180' y2='240' stroke='#3a465a'/><text x='20' y='310' font-size='15' fill='#e6edf3' font-weight='bold' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Web  ·  Standby</text><g transform='translate(250,280) scale(1.3)'><rect x='0' y='-30' width='220' height='26' rx='8' fill='#263041' stroke='#4dabf7' stroke-width='1'/><text x='10' y='-13' font-size='11' fill='#e6edf3' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Shared from Pixel 8 (app)</text><rect x='152' y='-27' width='62' height='20' rx='5' fill='#4dabf7'/><text x='183.0' y='-13' font-size='11' fill='#0b1220' font-weight='bold' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>Take over</text><rect width='220' height='84' rx='8' fill='#263041' stroke='#3a465a'/><text x='12' y='21' font-size='14' fill='#e6edf3' font-weight='bold' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Alex</text><g transform='translate(170,15)' stroke='#8b98a9' fill='none' stroke-width='1.5' stroke-linecap='round'><circle r='5'/><circle r='1.6' fill='#8b98a9'/><line x1='0' y1='-9' x2='0' y2='-6'/><line x1='0' y1='9' x2='0' y2='6'/><line x1='-9' y1='0' x2='-6' y2='0'/><line x1='9' y1='0' x2='6' y2='0'/><line x1='-9' y1='-9' x2='9' y2='9' stroke-width='2'/></g><g transform='translate(200,15)' stroke='#4dabf7' fill='none' stroke-width='1.6' stroke-linecap='round' stroke-dasharray='2 2'><path d='M-3.6,-4.8 A6,6 0 0 0 -3.6,4.8'/><path d='M3.6,-4.8 A6,6 0 0 1 3.6,4.8'/><path d='M-6.0,-8.0 A10,10 0 0 0 -6.0,8.0'/><path d='M6.0,-8.0 A10,10 0 0 1 6.0,8.0'/><circle r='2' fill='#1b2330' stroke-dasharray='none'/></g><text x='12' y='42' font-size='11' fill='#e6edf3' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>-- m MSL</text><text x='208' y='42' font-size='11' fill='#8b98a9' font-weight='normal' text-anchor='end' font-family='Helvetica, Arial, sans-serif'>No Fix</text><text x='12' y='58' font-size='11' fill='#e6edf3' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>-- km/h</text><text x='208' y='58' font-size='11' fill='#e6edf3' font-weight='normal' text-anchor='end' font-family='Helvetica, Arial, sans-serif'>--°</text><text x='12' y='75' font-size='10' fill='#8b98a9' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>--, --</text></g><text x='600' y='290' font-size='13' fill='#e6edf3' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Dashed blue icon, plus a chip above the panel.</text><text x='600' y='310' font-size='13' fill='#8b98a9' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Take over: one tap, no confirmation. The other device goes to Standby.</text><text x='600' y='330' font-size='13' fill='#8b98a9' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Still connected: alerts, chat and markers keep arriving.</text><line x1='20' y1='400' x2='1180' y2='400' stroke='#3a465a'/><text x='20' y='470' font-size='15' fill='#e6edf3' font-weight='bold' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Native app  ·  Live</text><g transform='translate(250,440) scale(1.3)'><rect width='220' height='84' rx='8' fill='#263041' stroke='#3a465a'/><text x='12' y='21' font-size='14' fill='#e6edf3' font-weight='bold' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Alex</text><g transform='translate(170,15)' stroke='#22c55e' fill='none' stroke-width='1.5' stroke-linecap='round'><circle r='5'/><circle r='1.6' fill='#22c55e'/><line x1='0' y1='-9' x2='0' y2='-6'/><line x1='0' y1='9' x2='0' y2='6'/><line x1='-9' y1='0' x2='-6' y2='0'/><line x1='9' y1='0' x2='6' y2='0'/></g><g transform='translate(200,15)' stroke='#22c55e' fill='none' stroke-width='1.6' stroke-linecap='round'><path d='M-3.6,-4.8 A6,6 0 0 0 -3.6,4.8'/><path d='M3.6,-4.8 A6,6 0 0 1 3.6,4.8'/><path d='M-6.0,-8.0 A10,10 0 0 0 -6.0,8.0'/><path d='M6.0,-8.0 A10,10 0 0 1 6.0,8.0'/><circle r='2' fill='#22c55e' stroke-dasharray='none'/></g><text x='12' y='42' font-size='11' fill='#e6edf3' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>42 m MSL</text><text x='208' y='42' font-size='11' fill='#8b98a9' font-weight='normal' text-anchor='end' font-family='Helvetica, Arial, sans-serif'>+/- 8 m</text><text x='12' y='58' font-size='11' fill='#e6edf3' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>0 km/h</text><text x='208' y='58' font-size='11' fill='#e6edf3' font-weight='normal' text-anchor='end' font-family='Helvetica, Arial, sans-serif'>--°</text><text x='12' y='75' font-size='10' fill='#8b98a9' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>-41.28650, 174.77620</text></g><text x='600' y='450' font-size='13' fill='#e6edf3' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Green icon is a button. Tap opens the "Pause sharing?" confirmation.</text><text x='600' y='470' font-size='13' fill='#8b98a9' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Replaces the main-menu footer toggle, which stays as a second entry</text><text x='600' y='490' font-size='13' fill='#8b98a9' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>because the panel is hidden in SetLocation and draw modes on mobile.</text><line x1='20' y1='560' x2='1180' y2='560' stroke='#3a465a'/><text x='20' y='630' font-size='15' fill='#e6edf3' font-weight='bold' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Native app  ·  Standby</text><g transform='translate(250,600) scale(1.3)'><rect x='0' y='-30' width='220' height='26' rx='8' fill='#263041' stroke='#4dabf7' stroke-width='1'/><text x='10' y='-13' font-size='11' fill='#e6edf3' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Shared from Chrome (web)</text><rect x='152' y='-27' width='62' height='20' rx='5' fill='#4dabf7'/><text x='183.0' y='-13' font-size='11' fill='#0b1220' font-weight='bold' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>Take over</text><rect width='220' height='84' rx='8' fill='#263041' stroke='#3a465a'/><text x='12' y='21' font-size='14' fill='#e6edf3' font-weight='bold' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Alex</text><g transform='translate(170,15)' stroke='#22c55e' fill='none' stroke-width='1.5' stroke-linecap='round'><circle r='5'/><circle r='1.6' fill='#22c55e'/><line x1='0' y1='-9' x2='0' y2='-6'/><line x1='0' y1='9' x2='0' y2='6'/><line x1='-9' y1='0' x2='-6' y2='0'/><line x1='9' y1='0' x2='6' y2='0'/></g><g transform='translate(200,15)' stroke='#4dabf7' fill='none' stroke-width='1.6' stroke-linecap='round' stroke-dasharray='2 2'><path d='M-3.6,-4.8 A6,6 0 0 0 -3.6,4.8'/><path d='M3.6,-4.8 A6,6 0 0 1 3.6,4.8'/><path d='M-6.0,-8.0 A10,10 0 0 0 -6.0,8.0'/><path d='M6.0,-8.0 A10,10 0 0 1 6.0,8.0'/><circle r='2' fill='#1b2330' stroke-dasharray='none'/></g><text x='12' y='42' font-size='11' fill='#e6edf3' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>42 m MSL</text><text x='208' y='42' font-size='11' fill='#8b98a9' font-weight='normal' text-anchor='end' font-family='Helvetica, Arial, sans-serif'>+/- 8 m</text><text x='12' y='58' font-size='11' fill='#e6edf3' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>0 km/h</text><text x='208' y='58' font-size='11' fill='#e6edf3' font-weight='normal' text-anchor='end' font-family='Helvetica, Arial, sans-serif'>--°</text><text x='12' y='75' font-size='10' fill='#8b98a9' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>-41.28650, 174.77620</text></g><text x='600' y='610' font-size='13' fill='#e6edf3' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Same chip. Take over is one tap, no confirmation.</text><text x='600' y='630' font-size='13' fill='#8b98a9' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Icon still opens Pause. GPS keeps running and fixes keep posting at</text><text x='600' y='650' font-size='13' fill='#8b98a9' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>the normal rate. The server discards them until this device is promoted.</text><line x1='20' y1='720' x2='1180' y2='720' stroke='#3a465a'/><text x='20' y='790' font-size='15' fill='#e6edf3' font-weight='bold' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Native app  ·  Paused</text><g transform='translate(250,760) scale(1.3)'><rect x='0' y='-30' width='220' height='26' rx='8' fill='#263041' stroke='#f59f00' stroke-width='1'/><text x='10' y='-13' font-size='11' fill='#e6edf3' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Paused · not connected</text><rect x='152' y='-27' width='62' height='20' rx='5' fill='#f59f00'/><text x='183.0' y='-13' font-size='11' fill='#0b1220' font-weight='bold' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>Resume</text><rect width='220' height='84' rx='8' fill='#263041' stroke='#3a465a'/><text x='12' y='21' font-size='14' fill='#e6edf3' font-weight='bold' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Alex</text><g transform='translate(170,15)' stroke='#8b98a9' fill='none' stroke-width='1.5' stroke-linecap='round'><circle r='5'/><circle r='1.6' fill='#8b98a9'/><line x1='0' y1='-9' x2='0' y2='-6'/><line x1='0' y1='9' x2='0' y2='6'/><line x1='-9' y1='0' x2='-6' y2='0'/><line x1='9' y1='0' x2='6' y2='0'/><line x1='-9' y1='-9' x2='9' y2='9' stroke-width='2'/></g><g transform='translate(200,15)' stroke='#f59f00' fill='none' stroke-width='1.6' stroke-linecap='round'><path d='M-3.6,-4.8 A6,6 0 0 0 -3.6,4.8'/><path d='M3.6,-4.8 A6,6 0 0 1 3.6,4.8'/><path d='M-6.0,-8.0 A10,10 0 0 0 -6.0,8.0'/><path d='M6.0,-8.0 A10,10 0 0 1 6.0,8.0'/><circle r='2' fill='#f59f00' stroke-dasharray='none'/><line x1='-11' y1='-11' x2='11' y2='11' stroke-dasharray='none' stroke-width='2'/></g><text x='12' y='42' font-size='11' fill='#e6edf3' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>-- m MSL</text><text x='208' y='42' font-size='11' fill='#8b98a9' font-weight='normal' text-anchor='end' font-family='Helvetica, Arial, sans-serif'>Paused</text><text x='12' y='58' font-size='11' fill='#e6edf3' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>-- km/h</text><text x='208' y='58' font-size='11' fill='#e6edf3' font-weight='normal' text-anchor='end' font-family='Helvetica, Arial, sans-serif'>--°</text><text x='12' y='75' font-size='10' fill='#8b98a9' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>--, --</text></g><text x='600' y='770' font-size='13' fill='#e6edf3' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Amber slashed icon and chip. Resume is one tap, as today.</text><text x='600' y='790' font-size='13' fill='#8b98a9' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Disconnected, GPS off, wake lock released, push removed.</text><text x='600' y='810' font-size='13' fill='#8b98a9' font-weight='normal' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Survives app restart. Resume claims the broadcaster role.</text></svg>