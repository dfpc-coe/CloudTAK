<svg xmlns='http://www.w3.org/2000/svg' width='1100' height='710' viewBox='0 0 1100 710'><title>Handover sequence</title><rect width='1100' height='710' fill='#1b2330'/><defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#8b98a9'/></marker></defs><text x='20' y='30' font-size='20' fill='#e6edf3' font-weight='bold' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>Handover between a phone app and a web session</text><rect x='90' y='48' width='220' height='30' rx='6' fill='#263041' stroke='#3a465a'/><text x='200' y='68' font-size='13' fill='#e6edf3' font-weight='bold' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>Phone app (iOS / Android)</text><line x1='200' y1='78' x2='200' y2='690' stroke='#3a465a' stroke-dasharray='4 4'/><rect x='450' y='48' width='220' height='30' rx='6' fill='#263041' stroke='#3a465a'/><text x='560' y='68' font-size='13' fill='#e6edf3' font-weight='bold' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>CloudTAK server</text><line x1='560' y1='78' x2='560' y2='690' stroke='#3a465a' stroke-dasharray='4 4'/><rect x='810' y='48' width='220' height='30' rx='6' fill='#263041' stroke='#3a465a'/><text x='920' y='68' font-size='13' fill='#e6edf3' font-weight='bold' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>Web session</text><line x1='920' y1='78' x2='920' y2='690' stroke='#3a465a' stroke-dasharray='4 4'/><rect x='20' y='96' width='1060' height='24' fill='#222c3b'/><text x='30' y='113' font-size='13' fill='#4dabf7' font-weight='bold' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>1  Phone is in the field and is the broadcaster</text><line x1='208' y1='142' x2='552' y2='142' stroke='#8b98a9' stroke-width='1.5' marker-end='url(#a)'/><text x='380.0' y='136' font-size='12' fill='#e6edf3' font-weight='normal' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>POST /api/profile/location every 5 s, accuracy 8 m</text><rect x='411.4' y='160' width='297.2' height='22' rx='5' fill='#263041' stroke='#22c55e'/><text x='560' y='175' font-size='11.5' fill='#e6edf3' font-weight='normal' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>Role: Phone (Live). Forwards to TAK Server</text><rect x='20' y='206' width='1060' height='24' fill='#222c3b'/><text x='30' y='223' font-size='13' fill='#4dabf7' font-weight='bold' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>2  User opens CloudTAK on a laptop with no GPS</text><line x1='912' y1='252' x2='568' y2='252' stroke='#8b98a9' stroke-width='1.5' marker-end='url(#a)'/><text x='740.0' y='246' font-size='12' fill='#e6edf3' font-weight='normal' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>WebSocket connect, label "Chrome, Windows"</text><line x1='568' y1='282' x2='912' y2='282' stroke='#8b98a9' stroke-width='1.5' marker-end='url(#a)'/><text x='740.0' y='276' font-size='12' fill='#e6edf3' font-weight='normal' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>status: broadcasting=false, by "Pixel 8 (app)"</text><rect x='830.8' y='300' width='178.39999999999998' height='22' rx='5' fill='#263041' stroke='#4dabf7'/><text x='920' y='315' font-size='11.5' fill='#e6edf3' font-weight='normal' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>Standby chip + Take over</text><rect x='20' y='346' width='1060' height='24' fill='#222c3b'/><text x='30' y='363' font-size='13' fill='#4dabf7' font-weight='bold' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>3  User taps Take over on the web session</text><line x1='912' y1='392' x2='568' y2='392' stroke='#8b98a9' stroke-width='1.5' marker-end='url(#a)'/><text x='740.0' y='386' font-size='12' fill='#e6edf3' font-weight='normal' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>claim role (explicit choice)</text><rect x='421.3' y='410' width='277.4' height='22' rx='5' fill='#263041' stroke='#22c55e'/><text x='560' y='425' font-size='11.5' fill='#e6edf3' font-weight='normal' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>Role: Web (Live). Phone becomes Standby</text><line x1='208' y1='452' x2='552' y2='452' stroke='#8b98a9' stroke-width='1.5' marker-end='url(#a)'/><text x='380.0' y='446' font-size='12' fill='#e6edf3' font-weight='normal' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>POST (backgrounded): 200 OK, fix discarded</text><rect x='61.30000000000001' y='470' width='277.4' height='22' rx='5' fill='#263041' stroke='#4dabf7'/><text x='200' y='485' font-size='11.5' fill='#e6edf3' font-weight='normal' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>Learns it is Standby on next foreground</text><rect x='20' y='516' width='1060' height='24' fill='#222c3b'/><text x='30' y='533' font-size='13' fill='#4dabf7' font-weight='bold' text-anchor='start' font-family='Helvetica, Arial, sans-serif'>4  User closes the web tab</text><line x1='912' y1='562' x2='568' y2='562' stroke='#8b98a9' stroke-width='1.5' marker-end='url(#a)'/><text x='740.0' y='556' font-size='12' fill='#e6edf3' font-weight='normal' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>WebSocket closes</text><rect x='404.8' y='580' width='310.4' height='22' rx='5' fill='#263041' stroke='#f59f00'/><text x='560' y='595' font-size='11.5' fill='#e6edf3' font-weight='normal' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>No broadcaster. Waits for the best fresh fix</text><line x1='208' y1='622' x2='552' y2='622' stroke='#8b98a9' stroke-width='1.5' marker-end='url(#a)'/><text x='380.0' y='616' font-size='12' fill='#e6edf3' font-weight='normal' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>next POST (normal rate, 5 s by default)</text><rect x='348.70000000000005' y='640' width='422.59999999999997' height='22' rx='5' fill='#263041' stroke='#22c55e'/><text x='560' y='655' font-size='11.5' fill='#e6edf3' font-weight='normal' text-anchor='middle' font-family='Helvetica, Arial, sans-serif'>Role: Phone (Live). Marker stays inside the 60 s stale window</text></svg>